[project]
name = "smixae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adjusttext>=1.3.0",
    "datasets>=4.8.3",
    "kaleido>=1.2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pdfplumber>=0.11.9",
    "pillow>=12.1.1",
    "sae-lens>=6.39.0",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.13",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.6",
    "typer>=0.24.1",
]

[project.scripts]
smixae = "cli.cli:app"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14.1"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = [
    "D105",   # missing magic method docstring
    "D107",   # missing __init__ docstring (covered by class docstring)
    "E501",   # line too long — not enforced; use # noqa: E501 for individual overrides
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"smixae_run.py" = ["D"]
"experiments/*" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/smixae", "src/analysis", "src/cli"]
