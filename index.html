<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Expert Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="src/latex/viewer/viewer.css">
  <style>
    :root {
      --header-bg: #1a1a2e;
      --header-color: #eee;
      --sidebar-bg: #fff;
      --border: #e0e0e0;
      --accent: #4c6ef5;
      --accent-light: #eef2ff;
      --text: #333;
      --text-muted: #999;
      --text-subtle: #666;
      --card-bg: #fff;
      --card-shadow: 0 1px 4px rgba(0,0,0,0.12);
      --card-hover: 0 2px 8px rgba(0,0,0,0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--header-bg);
      color: var(--header-color);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 18px; font-weight: 600; flex: 1; }
    header a { color: #88aaff; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    #layout { display: flex; flex: 1; overflow: hidden; }

    #sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px 0;
    }

    #search-input {
      width: calc(100% - 16px);
      margin: 0 8px 10px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
    }

    .nav-group {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 8px 12px 2px;
    }

    .nav-item {
      display: block;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item:hover { background: #f0f0f0; border-left-color: var(--header-bg); }

    #main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    #total-count {
      font-size: 13px;
      color: var(--text-subtle);
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Experiment group */
    .exp-group { margin-bottom: 32px; }

    .exp-group-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--header-bg);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent);
    }

    .type-section { margin-bottom: 14px; }

    .type-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    /* Card grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      box-shadow: var(--card-hover);
      text-decoration: none;
      color: inherit;
    }

    .card-body { padding: 10px 12px; flex: 1; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .card-sub { font-size: 11px; color: var(--text-muted); }
    .card-type {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 2px 7px;
      border-radius: 3px;
      margin-top: 6px;
    }
    .card-type.probe { background: #eef2ff; color: #4c6ef5; }
    .card-type.newline { background: #fff3cd; color: #856404; }

    #loading, #empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      font-size: 15px;
    }
    #empty { display: none; }
    #loading { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>SMIXAE Expert Viewer</h1>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <input id="search-input" type="search" placeholder="Filter…" oninput="filterTasks(this.value)">
      <div id="nav-list"></div>
    </nav>

    <main id="main">
      <div id="loading">Loading tasks…</div>
      <div id="total-count" style="display:none"></div>
      <div id="groups" style="display:none"></div>
      <div id="empty" style="display:none">No tasks found.</div>
    </main>
  </div>

  <script>
    const VIEWER_BASE = 'src/latex/viewer';
    const TASKS_URL = 'browser/tasks.json';
    let _allTasks = [];

    async function init() {
      try {
        const r = await fetch(TASKS_URL);
        const data = await r.json();
        _allTasks = data.tasks || [];
        renderNav(_allTasks);
        renderGroups(_allTasks);
      } catch (err) {
        document.getElementById('loading').textContent =
          'Failed to load tasks.json — run `uv run python scripts/build_static.py` first, or serve from the repo root.';
      }
    }

    // ── Helpers ──────────────────────────────────────────────────────────

    function isNewline(rel) {
      const parts = rel.split('/');
      return parts.length >= 2 && parts[1].startsWith('newline');
    }

    // Extract the numeric variant from newline tasks (e.g. "80" from "newline_80").
    function newlineVariant(rel) {
      const parts = rel.split('/');
      for (const p of parts) {
        const m = p.match(/^newline_(\d+)$/);
        if (m) return m[1];
      }
      return '';
    }

    function taskLabel(t) {
      const base = t.dataset_name || t.rel.split('/').pop();
      if (isNewline(t.rel)) {
        const v = newlineVariant(t.rel);
        return v ? `${base} (${v})` : base;
      }
      return base;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Sidebar nav ──────────────────────────────────────────────────────

    function renderNav(tasks) {
      const groups = {};
      tasks.forEach(t => {
        const exp = t.experiment_id || '';
        if (!groups[exp]) groups[exp] = [];
        groups[exp].push(t);
      });

      let html = '';
      for (const [exp, items] of Object.entries(groups)) {
        html += `<div class="nav-group">${escHtml(exp)}</div>`;
        items.forEach(t => {
          const label = taskLabel(t);
          const view = isNewline(t.rel) ? 'newline' : 'probe';
          html += `<a class="nav-item" href="${VIEWER_BASE}/index.html?task=${encodeURIComponent(t.rel)}"
                      target="_blank" title="${escHtml(t.rel)}">[${view}] ${escHtml(label)}</a>`;
        });
      }

      if (!html) {
        html = '<div style="padding:8px 12px;font-size:12px;color:#999">No tasks found</div>';
      }
      document.getElementById('nav-list').innerHTML = html;
    }

    // ── Main grid (grouped by experiment + type) ──────────────────────

    function renderGroups(tasks) {
      document.getElementById('loading').style.display = 'none';

      if (!tasks.length) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('total-count').style.display = 'none';
        document.getElementById('groups').style.display = 'none';
        return;
      }

      document.getElementById('empty').style.display = 'none';
      document.getElementById('total-count').style.display = 'block';
      document.getElementById('groups').style.display = 'block';

      const n = tasks.length;
      document.getElementById('total-count').textContent = `${n} task${n === 1 ? '' : 's'}`;

      // Group by experiment, preserve order of first appearance.
      const expOrder = [];
      const byExp = {};
      tasks.forEach(t => {
        const exp = t.experiment_id || '';
        if (!byExp[exp]) { byExp[exp] = { probe: [], newline: [] }; expOrder.push(exp); }
        (isNewline(t.rel) ? byExp[exp].newline : byExp[exp].probe).push(t);
      });

      const container = document.getElementById('groups');
      container.innerHTML = '';

      for (const exp of expOrder) {
        const { probe, newline } = byExp[exp];
        if (!probe.length && !newline.length) continue;

        const groupEl = document.createElement('div');
        groupEl.className = 'exp-group';

        const title = document.createElement('div');
        title.className = 'exp-group-title';
        title.textContent = exp;
        groupEl.appendChild(title);

        if (probe.length) {
          groupEl.appendChild(makeTypeSection('Probe tasks', probe, 'probe'));
        }
        if (newline.length) {
          groupEl.appendChild(makeTypeSection('Newline tasks', newline, 'newline'));
        }

        container.appendChild(groupEl);
      }
    }

    function makeTypeSection(heading, tasks, typeClass) {
      const section = document.createElement('div');
      section.className = 'type-section';

      const label = document.createElement('div');
      label.className = 'type-label';
      label.textContent = heading;
      section.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'grid';

      tasks.forEach(t => {
        const label = taskLabel(t);
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `${VIEWER_BASE}/index.html?task=${encodeURIComponent(t.rel)}`;
        card.target = '_blank';
        card.title = t.rel;
        card.innerHTML = `
          <div class="card-body">
            <div class="card-title">${escHtml(label)}</div>
            <span class="card-type ${typeClass}">${typeClass}</span>
          </div>`;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      return section;
    }

    // ── Filter ────────────────────────────────────────────────────────────

    function filterTasks(q) {
      if (!q) {
        renderGroups(_allTasks);
        renderNav(_allTasks);
        return;
      }
      const lower = q.toLowerCase();
      const filtered = _allTasks.filter(t =>
        (t.dataset_name || '').toLowerCase().includes(lower) ||
        (t.title || '').toLowerCase().includes(lower) ||
        (t.experiment_id || '').toLowerCase().includes(lower) ||
        t.rel.toLowerCase().includes(lower)
      );
      renderGroups(filtered);
      renderNav(filtered);
    }

    init();
  </script>
</body>
</html>
